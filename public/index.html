<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>企画ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: a pitch index an editor can skim. Numbered rows separated by hairlines, logline as the headline, quiet tags; the detail page reads like a one-sheet proposal with labels in a left column. Cool paper white, ink text, one indigo accent. */
:root{
  color-scheme:light;
  --bg:#f6f6f7;
  --surface:#ffffff;
  --line:#e2e3e8;
  --fg:#1b1e26;
  --muted:#697080;
  --accent:#2d4bd6;
  --on-accent:#ffffff;
  --accent-soft:#e9edff;
  --danger:#b3261e;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0f1115; --surface:#171a21; --line:#272b35; --fg:#e8e9ee; --muted:#9298a8;
    --accent:#93a5ff; --on-accent:#0f1115; --accent-soft:#1c2340; --danger:#ff8f86;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:14px; line-height:1.8; letter-spacing:.02em;
  padding-top:calc(14px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(110px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px; margin:0 auto; min-width:0}
button,input,textarea{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

/* buttons */
.btn{white-space:nowrap; display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:5px 14px; font-size:13px; font-weight:500; line-height:1.6; color:var(--fg)}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn.wide{padding:9px 16px; font-size:14px}
.link{background:none; border:0; padding:4px 0; font-size:13px; color:var(--muted)}
.link:hover{color:var(--fg); text-decoration:underline; text-underline-offset:4px}
.link.danger{color:var(--danger)}

/* header */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:12px; margin-bottom:26px; border-bottom:1px solid var(--line)}
.brand{background:none; border:0; padding:0; font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.2em; color:var(--fg)}
.bar-r{display:flex; gap:8px; align-items:center}
.msg{min-height:1.5em; margin:-12px 0 8px; font-size:12px; color:var(--muted)}
.msg.err{color:var(--danger)}

/* page heading + toolbar */
.head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
.h1{margin:0; font-family:var(--font-display); font-weight:800; font-size:21px; letter-spacing:.1em; line-height:1.4}
.count{font-size:12px; color:var(--muted); letter-spacing:.08em}
.lead{margin:6px 0 0; font-size:12.5px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.chip{border:1px solid var(--line); background:transparent; color:var(--muted); border-radius:999px; padding:1px 12px; font-size:12px; line-height:1.9}
.chip:hover{color:var(--fg); border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg); border-color:var(--fg); color:var(--bg)}
.tools{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.hint{margin:10px 0 0; font-size:12px; color:var(--muted)}

/* thumbnails (square) */
.thumb{display:grid; place-items:center; flex:none; width:64px; height:64px; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--surface); border:1px dashed var(--line); color:var(--muted); opacity:1}
.thumb svg{opacity:.5}
.thumb.has{border:0; background:var(--line)}
.thumb img{display:block; width:100%; height:100%; object-fit:cover}
.thumb.big{width:140px; height:140px}
.thumb.drop{border-color:var(--accent); background:var(--accent-soft)}
.d-head{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:16px; align-items:start}
.d-text{min-width:0}
.d-thumb{padding:0; border:0; background:none; width:132px; height:132px; border-radius:10px; overflow:hidden; cursor:zoom-in}
.d-thumb .thumb{width:100%; height:100%; border-radius:10px}
.thumb-edit{display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap}
.thumb-actions{display:grid; gap:8px; justify-items:start; min-width:0; flex:1 1 180px}
.lightbox{position:fixed; inset:0; z-index:60; display:grid; place-items:center; padding:16px; background:rgba(10,12,18,.82); cursor:zoom-out}
.lightbox img{width:min(92vw, 80vh, 560px); height:min(92vw, 80vh, 560px); object-fit:cover; border-radius:12px; background:var(--line)}

/* index rows */
.rows{margin-top:16px; border-top:1px solid var(--line)}
.row{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:4px 10px; border-bottom:1px solid var(--line)}
.row.dim{opacity:.62}
.row-body{padding-left:2px}
.row-main{display:grid; grid-template-columns:2.1rem 64px minmax(0,1fr); gap:0 6px; width:100%; text-align:left; background:none; border:0; padding:16px 0; border-radius:6px}
.row-main:hover .row-logline{color:var(--accent)}
.no{font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.6}
.row-body{display:grid; gap:2px; min-width:0}
.row-title{font-size:11.5px; color:var(--muted); letter-spacing:.08em; overflow-wrap:anywhere}
.row-logline{font-family:var(--font-display); font-weight:800; font-size:16.5px; line-height:1.55; letter-spacing:.04em; overflow-wrap:anywhere; transition:color .12s}
.row-logline.empty{font-weight:600; color:var(--muted); font-size:14px}
.tags{display:flex; flex-wrap:wrap; gap:5px 6px; margin-top:6px; align-items:center}
.tag{border:1px solid var(--line); border-radius:5px; padding:0 8px; font-size:11px; line-height:1.75; color:var(--muted); background:var(--surface)}
.tag.draft{border-style:dashed}
.row-side{display:flex; align-items:center; gap:4px; padding:10px 0 0}
.icon-btn{display:grid; place-items:center; width:34px; height:34px; background:none; border:0; border-radius:8px; color:var(--muted)}
.icon-btn:hover:not(:disabled){background:var(--accent-soft); color:var(--accent)}
.icon-btn[aria-pressed="true"]{color:var(--accent)}
.icon-btn:disabled{opacity:.25; cursor:default}
.empty-note{margin:56px 0 0; text-align:center; color:var(--muted); line-height:2}

/* floating actions */
.fab{position:fixed; z-index:5; right:calc(max(16px, env(safe-area-inset-right, 0px)) + 2px); bottom:calc(env(safe-area-inset-bottom, 0px) + 18px); display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border:1px solid var(--accent); border-radius:999px; background:var(--accent); color:var(--on-accent); font-size:13.5px; font-weight:700; letter-spacing:.06em; line-height:1.5; box-shadow:0 6px 18px rgba(20,24,40,.22)}
.fab:hover{filter:brightness(1.08)}
.fab.off{background:var(--surface); color:var(--fg); border-color:var(--line)}
.fab svg{display:block}

/* detail */
.nav{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:22px}
.nav .grp{display:flex; gap:8px; flex-wrap:wrap}
.meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted); letter-spacing:.08em}
.meta .no-big{font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--fg)}
.d-title{margin:8px 0 0; font-size:13px; color:var(--muted); letter-spacing:.1em; overflow-wrap:anywhere}
.d-logline{margin:4px 0 0; font-family:var(--font-display); font-weight:800; font-size:clamp(21px, 4.6vw, 28px); line-height:1.55; letter-spacing:.04em; text-wrap:balance; overflow-wrap:anywhere}
.d-logline.empty{font-weight:600; color:var(--muted); font-size:17px}
.d-tags{margin-top:14px}
.sheet{margin-top:26px}
.sec{display:grid; grid-template-columns:12.5rem minmax(0,1fr); gap:6px 20px; padding:20px 0; border-top:1px solid var(--line)}
.sec-label{margin:0; font-size:12px; font-weight:700; letter-spacing:.1em; color:var(--muted)}
.sec-hint{display:block; margin-top:2px; font-size:11px; font-weight:400; letter-spacing:.04em; opacity:.85}
.sec-body{min-width:0}
.text{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; font-size:14.5px; line-height:1.95}
.text.empty{color:var(--muted)}
.chars{display:grid; gap:10px}
.char{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0}
.char-name{margin:0 0 2px; font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.06em}
.plot{display:grid; gap:18px}
.ep{display:grid; grid-template-columns:3.4rem minmax(0,1fr); gap:2px 12px}
.ep-no{font-weight:700; font-size:12.5px; color:var(--accent); letter-spacing:.06em; padding-top:2px}
.pager{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:34px}
.pg{display:grid; gap:2px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:0}
.pg:hover{border-color:var(--muted)}
.pg.next{text-align:right}
.pg small{font-size:11px; color:var(--muted); letter-spacing:.06em}
.pg span{font-family:var(--font-display); font-weight:800; font-size:13.5px; line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.foot{margin-top:30px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--muted)}

/* form */
.in{display:block; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:16px; line-height:1.7; resize:none; overflow:hidden}
.in:hover{border-color:var(--muted)}
.in:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft)}
.in::placeholder{color:var(--muted); opacity:.7}
.in.big{font-family:var(--font-display); font-weight:800; font-size:18px; line-height:1.6}
.field{display:grid; gap:6px; margin-top:12px}
.seg{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.check{display:flex; gap:10px; align-items:flex-start; margin-top:18px; font-size:13px}
.check input{margin-top:5px; width:16px; height:16px; accent-color:var(--accent)}
.genre-row{display:flex; gap:8px; margin-top:8px}
.genre-row .in{padding:6px 12px; font-size:16px}
.tag.rm{display:inline-flex; align-items:center; gap:6px; color:var(--fg)}
.x{background:none; border:0; padding:0 2px; line-height:1; font-size:15px; color:var(--muted)}
.x:hover{color:var(--danger)}
.char-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px}
.char-no{font-size:11.5px; color:var(--muted); letter-spacing:.1em}
.stack{display:grid; gap:8px}
.add-char{margin-top:12px}
.editbar{position:fixed; z-index:6; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:10px; padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background:var(--surface); border-top:1px solid var(--line)}
.editbar .btn{min-width:120px}

.backup{margin-top:48px; padding-top:18px; border-top:1px solid var(--line)}
.backup .btns{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.confirm{margin-top:14px; padding:14px 16px; background:var(--surface); border:1px solid var(--accent); border-radius:10px}
.confirm p{margin:0 0 10px}

/* gate */
.gate{max-width:340px; margin:14vh auto 0; text-align:center}
.gate h1{margin:0 0 6px; font-family:var(--font-display); font-weight:800; font-size:24px; letter-spacing:.24em}
.gate p{margin:0 0 22px; color:var(--muted); font-size:12.5px}
.gate form{display:grid; gap:10px; text-align:left}
.gate .err{min-height:1.5em; margin:0; color:var(--danger); font-size:12.5px}

/* dialog */
.overlay{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(10,12,18,.5)}
.dialog{width:min(460px,100%); max-height:100%; overflow:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 20px 16px; box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dialog-title{margin:0 0 12px; font-family:var(--font-display); font-weight:800; font-size:16px; letter-spacing:.08em}
.share-text{overflow:auto; max-height:260px; font-size:14px}
.dialog-actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.dialog .check{margin-top:12px}
.dialog .hint{margin-top:10px}

@media (min-width:641px){
  .thumb{width:76px; height:76px}
  .row-main{grid-template-columns:2.1rem 76px minmax(0,1fr)}
  .d-thumb{width:240px; height:240px}
}
@media (max-width:640px){
  .sec{grid-template-columns:1fr; gap:6px; padding:18px 0}
  .ep{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
@media print{
  body{background:#fff; color:#000; padding:0; font-size:12px}
  .bar,.nav,.fab,.editbar,.pager,.foot,.msg,.icon-btn{display:none!important}
  .char{border-color:#bbb}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $app = document.getElementById('app');
function h(tag, props){
  var e = document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v == null || v === false) return;
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for(var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    for(var j = 0; j < kids.length; j++){
      var kid = kids[j];
      if(kid == null || kid === false) continue;
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  return e;
}
function svg(inner, size, filled){
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size || 18); s.setAttribute('height', size || 18);
  s.setAttribute('fill', filled ? 'currentColor' : 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.8');
  s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = inner;
  return s;
}
var BOOKMARK = '<path d="M7 4h10v16l-5-4-5 4z"/>';
var UP = '<path d="M12 19V5M6 11l6-6 6 6"/>';
var DOWN = '<path d="M12 5v14M6 13l6 6 6-6"/>';
var PLUS = '<path d="M12 5v14M5 12h14"/>';
var IMG = '<rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M20 15l-4.5-4.5L6 20"/>';
var TOKEN_KEY = 'kikaku-note-token', SAVED_KEY = 'kikaku-note-saved';
function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lsSet(k, v){ try{ if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); }catch(e){} }
function uid(){ return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function str(v){ return typeof v === 'string' ? v : ''; }
function autosize(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

/* ---------- data ---------- */
function blank(){
  return {id: uid(), title: '', logline: '', synopsis: '', genres: [], target: '', goal: '', hook: '', chars: [], plot: ['', '', ''], hidden: false, thumb: '', updated: ''};
}
function normItem(x){
  x = x || {};
  var b = blank();
  return {
    id: str(x.id) || b.id, title: str(x.title), logline: str(x.logline), synopsis: str(x.synopsis),
    genres: (Array.isArray(x.genres) ? x.genres : []).map(str).filter(Boolean).slice(0, 3),
    target: str(x.target), goal: str(x.goal), hook: str(x.hook),
    chars: (Array.isArray(x.chars) ? x.chars : []).map(function(c){ return {name: str(c && c.name), desc: str(c && c.desc)}; }),
    plot: [0, 1, 2].map(function(i){ return str(Array.isArray(x.plot) ? x.plot[i] : ''); }),
    hidden: x.hidden === true, thumb: str(x.thumb), updated: str(x.updated)
  };
}

/* ---------- api ---------- */
function api(method, path, body){
  var headers = {'content-type': 'application/json'};
  if(S.token) headers.authorization = 'Bearer ' + S.token;
  return fetch('/api' + path, {method: method, headers: headers, body: body ? JSON.stringify(body) : undefined}).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(data){
      if(!res.ok){
        var err = new Error((data && data.error) || ('http_' + res.status));
        err.status = res.status;
        throw err;
      }
      return data;
    });
  });
}
function errText(e){
  if(!e || !e.status) return '通信できませんでした。電波のよいところでもう一度試してください。';
  if(e.status === 401) return e.message === 'bad_password' ? 'パスワードが違います。' : 'ログインの期限が切れました。もう一度パスワードを入力してください。';
  if(e.status === 403) return '閲覧専用のため変更できません。';
  if(e.status === 413) return 'データが大きすぎて保存できません。';
  if(e.message === 'not_configured') return 'サーバーの設定が終わっていません。Netlifyの環境変数を確認してください。';
  return 'うまくいきませんでした。もう一度試してください。';
}

/* ---------- state ---------- */
function loadSaved(){
  try{ var a = JSON.parse(lsGet(SAVED_KEY) || '[]'); return Array.isArray(a) ? a.filter(function(x){ return typeof x === 'string'; }) : []; }
  catch(e){ return []; }
}
var S = {
  screen: 'boot', token: lsGet(TOKEN_KEY), role: '', items: [], id: null, from: 'list', genre: '',
  editing: false, isNew: false, draft: null, busy: false, msg: '', err: '', focusId: '', delArmed: false,
  saved: loadSaved(), modal: false, reorder: false, withLogline: true, light: '', plan: null
};
function canEdit(){ return S.role === 'edit'; }
function byId(id){ return S.items.filter(function(x){ return x.id === id; })[0]; }
function current(){ return byId(S.id); }

function persistSaved(){ lsSet(SAVED_KEY, JSON.stringify(S.saved)); }
function savedItems(){ return S.saved.map(byId).filter(Boolean); }
function isSaved(id){ return S.saved.indexOf(id) >= 0; }
function toggleSaved(id){
  S.saved = savedItems().map(function(x){ return x.id; });
  var i = S.saved.indexOf(id);
  if(i >= 0) S.saved.splice(i, 1); else S.saved.push(id);
  persistSaved();
}
function moveSaved(id, dir){
  var ids = savedItems().map(function(x){ return x.id; });
  var i = ids.indexOf(id), j = i + dir;
  if(i < 0 || j < 0 || j >= ids.length) return;
  var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
  S.saved = ids; persistSaved();
}
function usedGenres(){
  var seen = {}, out = [];
  S.items.forEach(function(it){ it.genres.forEach(function(g){ if(!seen[g]){ seen[g] = 1; out.push(g); } }); });
  return out;
}
function visibleItems(){
  return S.genre ? S.items.filter(function(it){ return it.genres.indexOf(S.genre) >= 0; }) : S.items;
}

/* ---------- thumbnails ---------- */
var thumbCache = {};
function clearThumbs(){
  Object.keys(thumbCache).forEach(function(k){ thumbCache[k].then(function(u){ if(u) URL.revokeObjectURL(u); }); });
  thumbCache = {};
}
function fetchThumb(it){
  var key = it.id + ':' + it.thumb;
  if(!thumbCache[key]){
    thumbCache[key] = fetch('/api/thumb/' + encodeURIComponent(it.id) + '?v=' + encodeURIComponent(it.thumb), {headers: {authorization: 'Bearer ' + S.token}})
      .then(function(r){ if(!r.ok) throw new Error('x'); return r.blob(); })
      .then(function(b){ return URL.createObjectURL(b); })
      .catch(function(){ delete thumbCache[key]; return ''; });
  }
  return thumbCache[key];
}
function thumbBox(it, extra){
  var box = h('span', {class: 'thumb' + (extra ? ' ' + extra : ''), 'aria-hidden': 'true'});
  if(it && it.thumb){
    box.classList.add('has');

  }else box.append(svg(IMG, 22));

}
/* 画像を正方形に切り抜いて、webpに変換して軽くする */
function makeThumb(file){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth, hh = img.naturalHeight, side = Math.min(w, hh), out = Math.min(480, side);
        var c = document.createElement('canvas'); c.width = c.height = out;
        var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out, out);
        ctx.drawImage(img, (w - side) / 2, (hh - side) / 2, side, side, 0, 0, out, out);
        URL.revokeObjectURL(url);
        var q = 0.82;
        (function attempt(type){
          c.toBlob(function(b){
            if(!b) return reject(new Error('blob'));
            if(type === 'image/webp' && b.type !== 'image/webp') return attempt('image/jpeg');
            if(b.size > 240 * 1024 && q > 0.35){ q -= 0.15; return attempt(type); }
            resolve(b);
          }, type, q);
        })('image/webp');
      }catch(e){ reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
function setDraftThumb(file){
  if(!file || !S.draft) return;
  S.err = ''; S.msg = '画像を変換しています…'; render();
  makeThumb(file).then(function(b){
    var d = S.draft; if(!d) return;
    if(d.thumbUrl) URL.revokeObjectURL(d.thumbUrl);
    d.thumbBlob = b; d.thumbUrl = URL.createObjectURL(b); d.removeThumb = false;
    S.msg = '画像を設定しました（' + Math.round(b.size / 1024) + 'KB）。保存すると反映されます。'; render();
  }).catch(function(){ S.msg = ''; S.err = 'この画像は読み込めませんでした。別の画像を試してください。'; render(); });
}
function clearDraftThumb(){
  var d = S.draft; if(!d) return;
  if(d.thumbUrl) URL.revokeObjectURL(d.thumbUrl);
  d.thumbBlob = null; d.thumbUrl = ''; if(d.thumb) d.removeThumb = true;
  render();
}
function pasteFromClipboard(){
  if(!navigator.clipboard || !navigator.clipboard.read){ S.err = 'この端末ではボタンから貼り付けできません。入力欄に画像を貼り付けてください。'; render(); return; }
  navigator.clipboard.read().then(function(list){
    for(var i = 0; i < list.length; i++){
      var t = list[i].types.filter(function(x){ return x.indexOf('image/') === 0; })[0];
      if(t) return list[i].getType(t).then(setDraftThumb);
    }
    S.err = 'クリップボードに画像がありません。'; render();
  }).catch(function(){ S.err = 'クリップボードを読み取れませんでした。画像をコピーして、入力欄に貼り付けてください。'; render(); });
}
function rawApi(method, path, blob){
  return fetch('/api' + path, {method: method, headers: {authorization: 'Bearer ' + S.token, 'content-type': blob ? blob.type : 'application/octet-stream'}, body: blob}).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(data){
      if(!res.ok){ var err = new Error((data && data.error) || ('http_' + res.status)); err.status = res.status; throw err; }
      return data;
    });
  });
}

/* ---------- backup (edit mode only) ---------- */
function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){ var fr = new FileReader(); fr.onload = function(){ resolve(fr.result); }; fr.onerror = reject; fr.readAsDataURL(blob); });
}
function dataUrlToBlob(url){
  var m = /^data:([^;]+);base64,(.*)$/.exec(url);
  if(!m) return null;
  var bin = atob(m[2]), u = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], {type: m[1]});
}
function exportBackup(){
  S.busy = true; S.err = ''; S.msg = 'バックアップを作っています…'; render();
  var out = [], missing = 0;
  S.items.reduce(function(p, it){
    return p.then(function(){
      var rec = JSON.parse(JSON.stringify(it)); delete rec.thumb; rec.thumbData = '';
      if(!it.thumb){ out.push(rec); return; }
      return fetch('/api/thumb/' + encodeURIComponent(it.id) + '?v=' + encodeURIComponent(it.thumb), {headers: {authorization: 'Bearer ' + S.token}})
        .then(function(r){ if(!r.ok) throw new Error('x'); return r.blob(); })
        .then(blobToDataUrl)
        .then(function(d){ rec.thumbData = d; out.push(rec); })
        .catch(function(){ missing++; out.push(rec); });
    });
  }, Promise.resolve()).then(function(){
    var text = JSON.stringify({app: 'kikaku-note', version: 1, exportedAt: new Date().toISOString(), items: out}, null, 1);
    var d = new Date(), name = 'kikaku-note-backup-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.json';
    var url = URL.createObjectURL(new Blob([text], {type: 'application/json'}));
    var a = h('a', {href: url, download: name}); document.body.append(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    S.busy = false; S.msg = out.length + '本の企画を書き出しました' + (missing ? '（画像' + missing + '枚は取得できませんでした）' : ''); render();
  }).catch(fail);
}
function readBackupFile(file){
  if(!file) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(!d || d.app !== 'kikaku-note' || !Array.isArray(d.items)) throw new Error('format');
      var seen = {};
      var plan = d.items.map(function(x){
        var it = normItem(x);
        it.thumbData = (x && typeof x.thumbData === 'string' && /^data:image\/(webp|jpeg);base64,/.test(x.thumbData)) ? x.thumbData : '';
        return it;
      }).filter(function(it){ if(!/^[A-Za-z0-9_-]+$/.test(it.id) || seen[it.id]) return false; seen[it.id] = 1; return true; });
      if(!plan.length) throw new Error('empty');
      S.plan = plan; S.err = ''; S.msg = '';
    }catch(e){ S.plan = null; S.msg = ''; S.err = 'このファイルは企画ノートのバックアップではありません。'; }
    render();
  };
  fr.onerror = function(){ S.err = 'ファイルを読み込めませんでした。'; render(); };
  fr.readAsText(file);
}
function runImport(){
  var plan = S.plan, n = 0;
  if(!plan) return;
  S.busy = true; S.err = ''; render();
  plan.reduce(function(p, it){
    return p.then(function(){
      n++; S.msg = '読み込んでいます… ' + n + ' / ' + plan.length; render();
      var payload = JSON.parse(JSON.stringify(it, function(k, v){ return k === 'thumbData' ? undefined : v; }));
      return api('PUT', '/notes/' + encodeURIComponent(it.id), payload).then(function(){
        var blob = it.thumbData ? dataUrlToBlob(it.thumbData) : null;
        if(blob) return rawApi('PUT', '/thumb/' + encodeURIComponent(it.id), blob);
      });
    });
  }, Promise.resolve()).then(function(){
    return api('PUT', '/order', {ids: plan.map(function(x){ return x.id; })});
  }).then(function(){
    S.plan = null; clearThumbs();
    return load(false).then(function(){ S.busy = false; S.msg = plan.length + '本の企画を読み込みました'; render(); });
  }).catch(function(e){ S.plan = null; fail(e); load(true); });
}
function backupPanel(){
  var fileIn = h('input', {type: 'file', accept: '.json,application/json', id: 'backup-file', hidden: true});
  fileIn.addEventListener('change', function(){ var f = fileIn.files && fileIn.files[0]; fileIn.value = ''; readBackupFile(f); });
  var box = h('section', {class: 'backup'},

    h('div', {class: 'btns'},

/* ---------- routing: #saved / #n-<id> ---------- */
function routeFromHash(){
  var hash = location.hash;
  if(hash === '#saved') return {screen: 'saved'};
  var m = /^#n-([A-Za-z0-9_-]+)$/.exec(hash);
  if(m) return {screen: 'detail', id: m[1]};
  return {screen: 'list'};
}
function basePath(){ return location.pathname + location.search; }
function applyRoute(){
  if(!S.role) return;
  var r = routeFromHash();
  S.modal = false;
  if(S.editing && !(r.screen === 'detail' && r.id === S.id)){ S.editing = false; S.draft = null; S.isNew = false; }
  if(S.editing){ render(); return; }
  S.reorder = false;
  if(r.screen === 'detail'){
    if(byId(r.id)){ S.screen = 'detail'; S.id = r.id; }
    else { S.screen = 'list'; history.replaceState(null, '', basePath()); }
  }else if(r.screen === 'saved' && !canEdit()) S.screen = 'saved';
  else S.screen = 'list';
  render();
}
function go(hash){
  history.pushState(null, '', hash || basePath());
  applyRoute();
  window.scrollTo(0, 0);
}
function openItem(id){ S.from = S.screen === 'saved' ? 'saved' : 'list'; S.delArmed = false; S.msg = ''; S.err = ''; go('#n-' + id); }
window.addEventListener('popstate', applyRoute);

function toLock(msg){
  S.token = ''; lsSet(TOKEN_KEY, ''); S.role = ''; S.items = []; S.id = null; S.editing = false; S.draft = null; S.isNew = false;
  clearThumbs(); S.light = ''; S.plan = null;
  S.busy = false; S.msg = ''; S.modal = false; S.reorder = false; S.genre = ''; S.err = msg || ''; S.screen = 'lock';
  history.replaceState(null, '', basePath()); render();
}
function fail(e){
  S.busy = false; S.msg = '';
  if(e && e.status === 401){ toLock(errText(e)); return; }
  S.err = errText(e); render();
}
function load(silent){
  if(!silent){ S.busy = true; S.err = ''; render(); }
  return api('GET', '/notes').then(function(r){
    S.role = r.role === 'edit' ? 'edit' : 'view';
    S.items = (r.items || []).map(normItem);
    S.busy = false;
    if(S.editing){ return; }
    if(S.screen === 'boot' || S.screen === 'lock') S.screen = 'list';
    applyRoute();
  }).catch(function(e){
    if(silent) return;
    S.busy = false;
    if(e && e.status === 401){ toLock(S.screen === 'boot' ? '' : errText(e)); return; }
    if(S.screen === 'boot') S.screen = 'lock';
    S.err = errText(e); render();
  });
}
function login(pw){
  S.busy = true; S.err = ''; render();
  api('POST', '/login', {password: pw}).then(function(r){
    S.token = r.token; lsSet(TOKEN_KEY, r.token); S.role = r.role; S.screen = 'boot';
    return load(false);
  }).catch(function(e){ S.busy = false; S.err = errText(e); render(); });
}

var orderChain = Promise.resolve();
function move(id, dir, mode){
  if(mode === 'saved'){ moveSaved(id, dir); render(); return; }
  var i = S.items.findIndex(function(x){ return x.id === id; }), j = i + dir;
  if(i < 0 || j < 0 || j >= S.items.length) return;
  var t = S.items[i]; S.items[i] = S.items[j]; S.items[j] = t;
  render();
  var ids = S.items.map(function(x){ return x.id; });
  orderChain = orderChain.then(function(){ return api('PUT', '/order', {ids: ids}); }).catch(function(e){

    S.busy = false; S.msg = '保存しました'; S.editing = false; S.isNew = false; S.draft = null; S.id = d.id;
    if(wasNew){ go('#n-' + d.id); } else { render(); window.scrollTo(0, 0); }
  }).catch(fail);
}
function deleteCurrent(id){
  S.busy = true; S.err = ''; S.msg = '削除しています…'; render();
  api('DELETE', '/notes/' + encodeURIComponent(id)).then(function(r){
    S.items = (r.items || []).map(normItem);
    S.busy = false; S.msg = '削除しました'; S.id = null; S.delArmed = false; go('');
  }).catch(fail);
}

function editForm(){
  var d = S.draft, f = h('div', {class: 'sheet'});
  f.append(h('div', {class: 'field'}, h('label', {class: 'sec-label', for: 'f-title', text: 'タイトル（仮でもOK）'}),
    (function(){ var i = h('input', {class: 'in', id: 'f-title', type: 'text', placeholder: '例：〇〇（仮）'}); i.value = d.title; i.addEventListener('input', function(){ d.title = i.value; }); return i; })()));
  f.append(h('div', {class: 'field'}, h('label', {class: 'sec-label', for: 'f-logline', text: '一言あらすじ'}), (function(){ var t = simple('logline', 2, '〇〇が〇〇する話'); t.classList.add('big'); return t; })()));
  var fileIn = h('input', {type: 'file', accept: 'image/*', id: 'f-thumb-file', hidden: true});
  fileIn.addEventListener('change', function(){ var fl = fileIn.files && fileIn.files[0]; fileIn.value = ''; setDraftThumb(fl); });
  var pv;
  if(d.thumbUrl) pv = h('span', {class: 'thumb big has'}, h('img', {src: d.thumbUrl, alt: 'サムネイルのプレビュー'}));
  else if(d.thumb && !d.removeThumb) pv = thumbBox(d, 'big');
  else pv = thumbBox(null, 'big');
  pv.addEventListener('dragover', function(e){ e.preventDefault(); pv.classList.add('drop'); });
  pv.addEventListener('dragleave', function(){ pv.classList.remove('drop'); });
  pv.addEventListener('drop', function(e){ e.preventDefault(); pv.classList.remove('drop'); var fl = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if(fl) setDraftThumb(fl); });
  var hasImg = !!(d.thumbUrl || (d.thumb && !d.removeThumb));
  f.append(h('div', {class: 'field'}, h('span', {class: 'sec-label'}, 'サムネイル', h('span', {class: 'sec-hint', text: '正方形に切り抜き、軽い形式（webp）に自動で変換します'})),
    h('div', {class: 'thumb-edit'}, pv, h('div', {class: 'thumb-actions'},
      h('button', {class: 'btn', type: 'button', onclick: function(){ fileIn.click(); }, text: '画像を選ぶ'}),
      h('button', {class: 'btn', type: 'button', onclick: pasteFromClipboard, text: 'コピーした画像を貼り付け'}),
      hasImg ? h('button', {class: 'link danger', type: 'button', onclick: clearDraftThumb, text: '画像を削除'}) : null,
      h('p', {class: 'hint', style: 'margin:0', text: '画像をコピーして、この画面でそのまま貼り付け（Ctrl+V）もできます。ドラッグ＆ドロップも使えます。'}),
      fileIn))));

  var chips = h('div', {class: 'tags'}, d.genres.map(function(g, i){
    return h('span', {class: 'tag rm'}, g, h('button', {class: 'x', type: 'button', 'aria-label': g + 'を外す', onclick: function(){ d.genres.splice(i, 1); render(); }, text: '×'}));
  }));
  var full = d.genres.length >= 3;
  var gi = h('input', {class: 'in', id: 'f-genre', type: 'text', maxlength: '14', placeholder: full ? '3つ登録済みです' : 'ジャンル（例：ラブコメ）', 'aria-label': 'ジャンル'});
  if(full) gi.disabled = true;
  var addGenre = function(){
    var v = gi.value.trim();
    if(!v || d.genres.length >= 3) return;
    if(d.genres.indexOf(v) < 0) d.genres.push(v);
    S.focusId = 'f-genre'; render();
  };
  gi.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); addGenre(); } });
  var addBtn = h('button', {class: 'btn', type: 'button', onclick: addGenre, text: '追加'}); if(full) addBtn.disabled = true;
  f.append(h('div', {class: 'field'}, h('label', {class: 'sec-label', for: 'f-genre', text: 'ジャンル（3つまで）'}), d.genres.length ? chips : null, h('div', {class: 'genre-row'}, gi, addBtn)));

  function ta(label, hint, key, rows, ph){
    return h('div', {class: 'field'}, h('label', {class: 'sec-label', for: 'f-' + key}, label, hint ? h('span', {class: 'sec-hint', text: hint}) : null), simple(key, rows, ph));
  }
  f.append(ta('あらすじ', '', 'synopsis', 6, '物語の流れを、自由に書いてください'));
  f.append(ta('ターゲット読者', 'どんな読者に向けて描くか', 'target', 3, '例：仕事に疲れた20〜30代の会社員'));
  f.append(ta('この漫画でやりたいこと', '', 'goal', 4, '描きたいシーン、伝えたい感情、試したい表現など'));
  f.append(ta('読み続けてもらうポイント', '次の話も読みたくなる引き', 'hook', 4, '謎、成長、関係の変化、毎話の楽しみなど'));

  var list = h('div', {class: 'stack'});
  d.chars.forEach(function(c, i){
    var nm = h('input', {class: 'in', id: 'c-name-' + i, type: 'text', placeholder: '名前', 'aria-label': 'キャラ' + (i + 1) + 'の名前'});
    nm.value = c.name; nm.addEventListener('input', function(){ c.name = nm.value; });
    var ds = area('c-desc-' + i, 3, '年齢・性格・見た目・役割など', {get: function(){ return c.desc; }, set: function(v){ c.desc = v; }});
    ds.setAttribute('aria-label', 'キャラ' + (i + 1) + 'の説明');
    list.append(h('div', {class: 'char'},
      h('div', {class: 'char-head'}, h('span', {class: 'char-no', text: 'キャラ ' + (i + 1)}), h('button', {class: 'link', type: 'button', onclick: function(){ d.chars.splice(i, 1); render(); }, text: '削除'})),
      h('div', {class: 'stack'}, nm, ds)));
  });
  f.append(h('div', {class: 'field'}, h('span', {class: 'sec-label', text: 'キャラクター'}), list,
    h('div', null, h('button', {class: 'btn add-char', type: 'button', onclick: function(){ d.chars.push({name: '', desc: ''}); S.focusId = 'c-name-' + (d.chars.length - 1); render(); }, text: '＋ キャラを追加'}))));

  var plot = h('div', {class: 'stack'});
  var phs = ['導入：何が起きて、主人公はどうなるか', '展開：状況がどう変わるか', '引き：次を読みたくなる終わり方'];
  [0, 1, 2].forEach(function(i){
    var t = area('f-plot-' + i, 3, phs[i], {get: function(){ return d.plot[i]; }, set: function(v){ d.plot[i] = v; }});
    t.setAttribute('aria-label', '第' + (i + 1) + '話');
    plot.append(h('div', {class: 'field', style: 'margin-top:0'}, h('span', {class: 'ep-no', text: '第' + (i + 1) + '話'}), t));
  });
  f.append(h('div', {class: 'field'}, h('span', {class: 'sec-label', text: '簡易3話分プロット'}), plot));

  var hid = h('input', {type: 'checkbox', id: 'f-hidden'}); hid.checked = d.hidden;
  hid.addEventListener('change', function(){ d.hidden = hid.checked; });
  f.append(h('label', {class: 'check', for: 'f-hidden'}, hid, h('span', null, '非公開にする（下書き）', h('span', {class: 'sec-hint', text: 'チェックすると、閲覧用パスワードの人には表示されません。'}))));
  return f;
}

function detailScreen(){
  var editing = S.editing;
  var it = editing ? S.draft : current();
  if(!it){ S.screen = 'list'; return listScreen(); }
  var fromSaved = S.from === 'saved' && !canEdit();
  var seq = fromSaved ? savedItems() : S.items;
  var pos = seq.findIndex(function(x){ return x.id === it.id; });
  var no = S.items.findIndex(function(x){ return x.id === it.id; }) + 1 || S.items.length + 1;

  var nav = h('div', {class: 'nav'}, h('button', {class: 'link', type: 'button', onclick: function(){ if(editing && S.isNew){ S.editing = false; S.draft = null; S.isNew = false; S.screen = 'list'; render(); } else go(fromSaved ? '#saved' : ''); }, text: fromSaved ? '← 保存一覧' : '← 企画一覧'}));
  var grp = h('div', {class: 'grp'});
  if(canEdit() && !editing) grp.append(h('button', {class: 'btn', type: 'button', onclick: function(){ S.draft = JSON.parse(JSON.stringify(it)); S.editing = true; S.err = ''; S.msg = ''; render(); }, text: '編集'}));
  nav.append(grp);
  var wrap = h('div', {class: 'wrap'}, header(), msgLine(), nav);

  if(editing){
    wrap.append(h('div', {class: 'meta'}, h('span', {class: 'no-big', text: 'No.' + pad(no)}), h('span', {text: S.isNew ? '新しい企画' : '編集中'})));
    wrap.append(editForm());
    wrap.append(h('div', {class: 'editbar'},
      h('button', {class: 'btn wide', type: 'button', disabled: S.busy, onclick: function(){ if(S.isNew){ S.screen = 'list'; S.draft = null; S.isNew = false; } S.editing = false; S.err = ''; render(); }, text: 'やめる'}),
      h('button', {class: 'btn primary wide', type: 'button', disabled: S.busy, onclick: saveDraft, text: '保存'})));
    return wrap;
  }

  var dText = h('div', {class: 'd-text'},
    h('div', {class: 'meta'}, h('span', {class: 'no-big', text: 'No.' + pad(no)}), it.hidden ? h('span', {class: 'tag draft', text: '非公開（下書き）'}) : null),
    it.title ? h('p', {class: 'd-title', text: it.title}) : null,
    h('h1', {class: 'd-logline' + (it.logline ? '' : ' empty'), text: it.logline || '一言あらすじは未入力です'}),
    it.genres.length ? h('div', {class: 'tags d-tags'}, it.genres.map(function(g){ return h('span', {class: 'tag', text: g}); })) : null);
  var dHead = h('div', {class: 'd-head'}, dText);
  if(it.thumb){
    dHead.append(h('button', {class: 'd-thumb', type: 'button', 'aria-label': 'サムネイルを大きく表示', onclick: function(){
      fetchThumb(it).then(function(u){ if(u){ S.light = u; render(); } });
    }}, thumbBox(it)));
  }
  wrap.append(dHead);

  var sheet = h('div', {class: 'sheet'});
  sheet.append(sec('あらすじ', '', textView(it.synopsis)));
  sheet.append(sec('ターゲット読者', 'どんな読者に向けて描くか', textView(it.target)));
  sheet.append(sec('この漫画でやりたいこと', '', textView(it.goal)));
  sheet.append(sec('読み続けてもらうポイント', '次の話も読みたくなる引き', textView(it.hook)));
  sheet.append(sec('キャラクター', '', it.chars.length ? h('div', {class: 'chars'}, it.chars.map(function(c){
    return h('div', {class: 'char'}, h('p', {class: 'char-name', text: c.name || '名前未定'}), h('p', {class: 'text' + (c.desc ? '' : ' empty'), text: c.desc || '説明なし'}));
  })) : textView('')));
  var plot = h('div', {class: 'plot'});
  [0, 1, 2].forEach(function(i){ plot.append(h('div', {class: 'ep'}, h('div', {class: 'ep-no', text: '第' + (i + 1) + '話'}), textView(it.plot[i]))); });
  sheet.append(sec('簡易3話分プロット', '', plot));
  wrap.append(sheet);

  if(pos >= 0 && seq.length > 1){
    var prev = seq[pos - 1], next = seq[pos + 1];
    var label = function(x){ return x.title || x.logline || '無題'; };
    wrap.append(h('div', {class: 'pager'},
      prev ? h('button', {class: 'pg', type: 'button', onclick: function(){ go('#n-' + prev.id); }}, h('small', {text: '← 前の企画'}), h('span', {text: label(prev)})) : h('span'),
      next ? h('button', {class: 'pg next', type: 'button', onclick: function(){ go('#n-' + next.id); }}, h('small', {text: '次の企画 →'}), h('span', {text: label(next)})) : h('span')));
  }
  var dt = it.updated ? new Date(it.updated) : null;
  var foot = h('div', {class: 'foot'}, h('span', {text: dt && !isNaN(dt) ? '最終更新 ' + dt.toLocaleDateString('ja-JP') : ''}),
    h('button', {class: 'link', type: 'button', onclick: function(){ window.print(); }, text: '印刷・PDF保存'}));
  wrap.append(foot);
  if(canEdit()){
    wrap.append(h('div', {style: 'margin-top:14px'}, h('button', {class: 'link danger', type: 'button', disabled: S.busy, onclick: function(){
      if(!S.delArmed){ S.delArmed = true; render(); return; }
      deleteCurrent(it.id);
    }, text: S.delArmed ? '本当に削除する（もう一度押す）' : 'この企画を削除'})));
  }else{
    var saveBtn = h('button', {class: 'fab', type: 'button'});
    var paint = function(){
      var on = isSaved(it.id);
      saveBtn.className = 'fab' + (on ? ' off' : '');
      saveBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      saveBtn.replaceChildren(svg(BOOKMARK, 16, on), on ? '保存済み（はずす）' : 'この企画を保存');
    };
    saveBtn.addEventListener('click', function(){ toggleSaved(it.id); paint(); updateSavedBtn(); });
    paint();
    wrap.append(saveBtn);
  }
  return wrap;
}

/* ---- share dialog ---- */
function shareText(){
  var lines = ['気に入った企画リスト（連載化させたい順）'];
  savedItems().forEach(function(it, i){
    var head = it.title || it.logline || '無題';
    lines.push((i + 1) + '. ' + head);
    if(S.withLogline && it.title && it.logline) lines.push('   ' + it.logline);
  });
  return lines.join('\n');
}
function copyText(ta, done){
  function fallback(){ try{ ta.focus(); ta.select(); done(document.execCommand('copy')); }catch(e){ done(false); } }
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function(){ done(true); }, fallback);
  else fallback();
}
function shareDialog(){
  var ta = h('textarea', {class: 'in share-text', id: 'share-text', readonly: true, rows: '7', 'aria-label': '気に入った企画リスト'});
  var note = h('p', {class: 'hint', text: 'コピーして、メールやチャットに貼って送ってください。'});
  var copy = h('button', {class: 'btn primary', id: 'share-copy', type: 'button', text: 'コピーする'});
  var refresh = function(){ ta.value = shareText(); ta.rows = Math.min(Math.max(ta.value.split('\n').length, 3), 10); copy.textContent = 'コピーする'; };
  refresh();
  var cb = h('input', {type: 'checkbox', id: 'share-logline'}); cb.checked = S.withLogline;
  cb.addEventListener('change', function(){ S.withLogline = cb.checked; refresh(); });
  copy.addEventListener('click', function(){
    copyText(ta, function(ok){ note.textContent = ok ? 'コピーしました。' : 'コピーできませんでした。文字を選んでコピーしてください。'; copy.textContent = ok ? 'コピーしました' : 'コピーする'; });
  });
  var close = function(){ S.modal = false; render(); };
  return h('div', {class: 'overlay', onclick: function(e){ if(e.target === e.currentTarget) close(); }},
    h('div', {class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'share-h'},
      h('h2', {class: 'dialog-title', id: 'share-h', text: '気に入った企画リストを伝える'}),
      ta,
      h('label', {class: 'check', for: 'share-logline'}, cb, h('span', {text: '一言あらすじも添える'})),
      h('div', {class: 'dialog-actions'}, copy, h('button', {class: 'btn', type: 'button', onclick: close, text: '閉じる'})),
      note));
}

/* ---------- render ---------- */
function render(){
  var node;
  if(S.screen === 'lock') node = gateScreen();
  else if(S.screen === 'list') node = listScreen();
  else if(S.screen === 'detail') node = detailScreen();
  else if(S.screen === 'saved') node = savedScreen();
  else node = bootScreen();
  $app.replaceChildren(node);
  if(S.modal && S.screen === 'saved') $app.append(shareDialog());
  if(S.light) $app.append(h('div', {class: 'lightbox', role: 'dialog', 'aria-label': 'サムネイル', onclick: function(){ S.light = ''; render(); }}, h('img', {src: S.light, alt: ''})));
  Array.prototype.forEach.call($app.querySelectorAll('textarea'), autosize);
  var it = S.screen === 'detail' ? (S.editing ? S.draft : current()) : null;
  document.title = it && (it.title || it.logline) ? (it.title || it.logline) + '｜企画ノート' : '企画ノート';
  var f = S.focusId; S.focusId = '';
  var target = f ? document.getElementById(f) : (S.screen === 'lock' ? document.getElementById('g-pw') : null);
  if(target && !target.disabled){ try{ target.focus(); }catch(e){} }
}

/* ---------- start ---------- */
render();
if(S.token){ load(false); }
else { S.screen = 'lock'; render(); }

document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && S.token && S.role && !S.editing && !S.busy && !S.modal && !S.reorder) load(true);
});
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(S.light){ S.light = ''; render(); }
  else if(S.modal){ S.modal = false; render(); }
});
/* コピーした画像を、編集中ならそのまま貼り付けられる */
document.addEventListener('paste', function(e){
  if(!S.editing || !e.clipboardData) return;
  var list = e.clipboardData.items || [];
  for(var i = 0; i < list.length; i++){
    if(list[i].kind === 'file' && list[i].type.indexOf('image/') === 0){
      var file = list[i].getAsFile();
      if(file){ e.preventDefault(); setDraftThumb(file); return; }
    }
  }
});
window.addEventListener('beforeunload', function(e){ if(S.editing){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
