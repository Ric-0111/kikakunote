<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>企画ノート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout concept: manga-panel frames with a numbered tab on top, a genre strip along the bottom, generous white space. Monochrome ink on paper, one blue-black accent for focus. */
:root{
  color-scheme:light;
  --bg:#fafafb;
  --fg:#16171b;
  --muted:#74767f;
  --faint:#d8d9df;
  --accent:#2c3fa8;
  --danger:#a8261e;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --bw:1.5px;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#131418; --fg:#ecece9; --muted:#8f919b; --faint:#363840; --accent:#97a4ff; --danger:#ff8f86;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  background:var(--bg); color:var(--fg);
  font-family:var(--font-body); font-size:15px; line-height:1.85; letter-spacing:.02em;
  padding-top:calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom:calc(140px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:660px; margin:0 auto; min-width:0}
button,input,textarea{font:inherit; color:inherit; letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* header */
.bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:72px}
.brand{font-family:var(--font-display); font-weight:800; font-size:18px; letter-spacing:.28em}
.bar-r{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.tag{font-size:12px; letter-spacing:.14em; border:var(--bw) solid var(--fg); border-radius:999px; padding:1px 12px; line-height:1.9}
.btn{background:transparent; border:var(--bw) solid var(--fg); border-radius:999px; padding:6px 18px; font-size:13px; font-weight:500; line-height:1.7; letter-spacing:.08em}
.btn:hover:not(:disabled){background:var(--fg); color:var(--bg)}
.btn.primary{background:var(--fg); color:var(--bg)}
.btn.primary:hover:not(:disabled){background:transparent; color:var(--fg)}
.btn:disabled{opacity:.45; cursor:default}
.link{background:none; border:0; padding:4px 2px; font-size:13px; color:var(--muted); text-decoration:underline; text-underline-offset:4px}
.link:hover{color:var(--fg)}
.link.danger{color:var(--danger)}
.msg{min-height:1.8em; font-size:13px; color:var(--muted); margin:-48px 0 40px; text-align:center}
.msg.err{color:var(--danger)}

/* panel with number tab */
.panel{position:relative; border:var(--bw) solid var(--fg); background:var(--bg); margin-top:40px}
.tab{position:absolute; bottom:100%; left:50%; transform:translateX(-50%); width:76px; height:calc(38px + var(--bw)); border:var(--bw) solid var(--fg); border-bottom:0; border-radius:40px 40px 0 0; background:var(--bg); display:grid; place-items:end center; padding-bottom:7px; font-weight:700; font-size:18px; line-height:1.4}
.tab svg{display:block}
.panel-body{padding:46px 26px 44px; text-align:center}
.card-title{margin:0 0 14px; font-size:12px; letter-spacing:.2em; color:var(--muted)}
.logline{margin:0; font-family:var(--font-display); font-weight:800; font-size:clamp(19px, 4.6vw, 25px); line-height:1.75; letter-spacing:.06em; text-wrap:balance; overflow-wrap:anywhere}
.logline.empty{font-weight:600; color:var(--muted); font-size:16px}
.strip{border-top:var(--bw) solid var(--fg); padding:18px 16px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px 12px}
.pill{flex:0 1 164px; min-width:0; text-align:center; border:var(--bw) solid var(--fg); border-radius:999px; padding:3px 14px; font-size:13px; font-weight:700; letter-spacing:.1em; line-height:1.8; overflow-wrap:anywhere}
.strip-empty{font-size:12px; color:var(--muted); letter-spacing:.14em}

/* list */
.card{cursor:pointer; margin-top:72px; box-shadow:5px 5px 0 var(--faint); transition:box-shadow .15s, transform .15s}
.card:first-of-type{margin-top:44px}
.card:hover{box-shadow:8px 8px 0 var(--faint); transform:translate(-1px,-1px)}
.count{font-size:12px; letter-spacing:.2em; color:var(--muted); text-align:center; margin:0}
.dots{display:flex; flex-direction:column; align-items:center; gap:22px; margin:72px 0 0}
.dots span{display:block; border-radius:50%; background:var(--fg)}
.dots span:nth-child(1){width:9px; height:9px}
.dots span:nth-child(2){width:7px; height:7px}
.dots span:nth-child(3){width:5px; height:5px}
.dots span:nth-child(4){width:3px; height:3px}
.fab{position:fixed; right:calc(max(16px, env(safe-area-inset-right, 0px)) + 8px); bottom:calc(env(safe-area-inset-bottom, 0px) + 28px); width:68px; height:68px; border-radius:50%; border:var(--bw) solid var(--fg); background:var(--bg); display:grid; place-items:center; box-shadow:4px 4px 0 var(--faint); transition:transform .15s, box-shadow .15s}
.fab:hover{transform:translate(-1px,-1px); box-shadow:6px 6px 0 var(--faint); background:var(--fg); color:var(--bg)}
.empty-note{text-align:center; color:var(--muted); margin-top:56px; line-height:2.1}

/* detail */
.back{margin-bottom:12px}
.top-actions{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:56px}
.top-actions .grp{display:flex; gap:10px; flex-wrap:wrap}
.sections{display:grid; gap:64px; margin-top:72px}
.sec{min-width:0}
.sec-label{margin:0 0 4px; font-size:13px; font-weight:700; letter-spacing:.16em}
.sec-hint{margin:0 0 14px; font-size:12px; color:var(--muted); letter-spacing:.06em}
.text{margin:0; white-space:pre-wrap; overflow-wrap:anywhere}
.text.empty{color:var(--muted)}
.chars{display:grid; gap:36px}
.char{min-width:0}
.char-name{margin:0; font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:.08em}
.char-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
.char-no{font-size:12px; color:var(--muted); letter-spacing:.16em}
.plot{display:grid; gap:30px}
.ep{display:grid; grid-template-columns:4.2rem minmax(0,1fr); gap:6px 14px}
.ep-no{font-family:var(--font-display); font-weight:800; letter-spacing:.1em; padding-top:2px}
.stamp{margin-top:72px; text-align:center; font-size:12px; color:var(--muted); letter-spacing:.14em}
.danger-zone{margin-top:24px; text-align:center}

/* inputs */
.in{display:block; width:100%; background:transparent; border:var(--bw) solid var(--faint); border-radius:0; padding:12px 14px; line-height:1.85; resize:none; overflow:hidden}
.in:hover{border-color:var(--muted)}
.in:focus{border-color:var(--fg); outline:none}
.in:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.in::placeholder{color:var(--muted); opacity:.75}
.in.bare{border:0; border-bottom:1px dashed var(--faint); padding:8px 4px; text-align:center}
.in.bare:focus{border-bottom-color:var(--fg)}
.in.title{font-size:12px; letter-spacing:.2em; margin-bottom:14px}
.in.logline-in{font-family:var(--font-display); font-weight:800; font-size:clamp(19px, 4.6vw, 25px); line-height:1.75; letter-spacing:.06em}
.title-view{margin:0 0 14px; font-size:12px; letter-spacing:.2em; color:var(--muted)}
.genre-add{border-top:1px dashed var(--faint); padding:14px 16px; display:flex; gap:10px; align-items:center}
.genre-add .in{padding:6px 12px}
.pill.removable{display:inline-flex; align-items:center; justify-content:center; gap:8px}
.x{background:none; border:0; padding:0 2px; line-height:1; font-size:16px; color:var(--muted)}
.x:hover{color:var(--danger)}
.add-char{margin-top:20px}

/* lock */
.gate{max-width:420px; margin:12vh auto 0; text-align:center}
.gate h1{font-family:var(--font-display); font-weight:800; font-size:26px; letter-spacing:.3em; margin:0 0 8px}
.gate p{margin:0 0 28px; color:var(--muted); font-size:13px; letter-spacing:.08em}
.gate .panel{text-align:left}
.gate .panel-body{text-align:left; display:grid; gap:14px; padding:44px 24px 28px}
.gate .err{color:var(--danger); font-size:13px; min-height:1.6em; margin:0}
.gate label{font-size:12px; letter-spacing:.14em; color:var(--muted)}

@media (max-width:480px){
  .panel-body{padding:42px 18px 36px}
  .card{margin-top:64px}
  .ep{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  .card,.fab{transition:none}
  .card:hover,.fab:hover{transform:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* ---------- small helpers ---------- */
var $app = document.getElementById('app');
function h(tag, props){
  var e = document.createElement(tag);
  if(props) Object.keys(props).forEach(function(k){
    var v = props[k];
    if(v == null || v === false) return;
    if(k === 'class') e.className = v;
    else if(k === 'text') e.textContent = v;
    else if(k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  });
  for(var i = 2; i < arguments.length; i++){
    var kids = [].concat(arguments[i]);
    for(var j = 0; j < kids.length; j++){
      var kid = kids[j];
      if(kid == null || kid === false) continue;
      e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
  }
  return e;
}
function svg(inner, size){
  var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size || 26); s.setAttribute('height', size || 26);
  s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.6');
  s.setAttribute('stroke-linejoin', 'round'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('aria-hidden', 'true');
  s.innerHTML = inner;
  return s;
}
var PENCIL = '<path d="M15.5 4.5l4 4L8 20H4v-4L15.5 4.5z"/><path d="M13 7l4 4"/>';
var LOCK = '<rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 018 0v3"/>';
var TOKEN_KEY = 'kikaku-note-token';
function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lsSet(k, v){ try{ if(v) localStorage.setItem(k, v); else localStorage.removeItem(k); }catch(e){} }
function uid(){ return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function str(v){ return typeof v === 'string' ? v : ''; }
function autosize(t){ t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; }

/* ---------- data ---------- */
function blank(){
  return {id: uid(), title: '', logline: '', synopsis: '', genres: [], target: '', goal: '', hook: '', chars: [], plot: ['', '', ''], updated: ''};
}
function normItem(x){
  x = x || {};
  var b = blank();
  return {
    id: str(x.id) || b.id, title: str(x.title), logline: str(x.logline), synopsis: str(x.synopsis),
    genres: (Array.isArray(x.genres) ? x.genres : []).map(str).filter(Boolean).slice(0, 3),
    target: str(x.target), goal: str(x.goal), hook: str(x.hook),
    chars: (Array.isArray(x.chars) ? x.chars : []).map(function(c){ return {name: str(c && c.name), desc: str(c && c.desc)}; }),
    plot: [0, 1, 2].map(function(i){ return str(Array.isArray(x.plot) ? x.plot[i] : ''); }),
    updated: str(x.updated)
  };
}

/* ---------- api ---------- */
function api(method, path, body){
  var headers = {'content-type': 'application/json'};
  if(S.token) headers.authorization = 'Bearer ' + S.token;
  return fetch('/api' + path, {method: method, headers: headers, body: body ? JSON.stringify(body) : undefined}).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(data){
      if(!res.ok){
        var err = new Error((data && data.error) || ('http_' + res.status));
        err.status = res.status;
        throw err;
      }
      return data;
    });
  });
}
function errText(e){
  if(!e || !e.status) return '通信できませんでした。電波のよいところでもう一度試してください。';
  if(e.status === 401) return e.message === 'bad_password' ? 'パスワードが違います。' : 'ログインの期限が切れました。もう一度パスワードを入力してください。';
  if(e.status === 403) return '閲覧専用のため変更できません。';
  if(e.status === 413) return 'データが大きすぎて保存できません。';
  if(e.message === 'not_configured') return 'サーバーの設定が終わっていません。Netlifyの環境変数を確認してください。';
  return 'うまくいきませんでした。もう一度試してください。';
}

/* ---------- state ---------- */
var S = {
  screen: 'boot', token: lsGet(TOKEN_KEY), role: '', items: [], id: null,
  editing: false, isNew: false, draft: null, busy: false, msg: '', err: '', focusId: '', delArmed: false
};
function canEdit(){ return S.role === 'edit'; }
function current(){ return S.items.filter(function(x){ return x.id === S.id; })[0]; }
function toLock(msg){
  S.token = ''; lsSet(TOKEN_KEY, ''); S.role = ''; S.items = []; S.id = null; S.editing = false; S.draft = null; S.isNew = false;
  S.busy = false; S.msg = ''; S.err = msg || ''; S.screen = 'lock'; render();
}
function fail(e){
  S.busy = false; S.msg = '';
  if(e && e.status === 401){ toLock(errText(e)); return; }
  S.err = errText(e); render();
}

function load(silent){
  if(!silent){ S.busy = true; S.err = ''; render(); }
  return api('GET', '/notes').then(function(r){
    S.role = r.role === 'edit' ? 'edit' : 'view';
    S.items = (r.items || []).map(normItem);
    S.busy = false;
    if(S.screen === 'boot' || S.screen === 'lock') S.screen = 'list';
    if(S.screen === 'detail' && !S.editing && !current()) S.screen = 'list';
    if(!(S.editing && S.screen === 'detail')) render();
  }).catch(function(e){
    if(silent) return;
    S.busy = false;
    if(e && e.status === 401){ toLock(S.screen === 'boot' ? '' : errText(e)); return; }
    if(S.screen === 'boot') S.screen = 'lock';
    S.err = errText(e); render();
  });
}
function login(pw){
  S.busy = true; S.err = ''; render();
  api('POST', '/login', {password: pw}).then(function(r){
    S.token = r.token; lsSet(TOKEN_KEY, r.token); S.role = r.role; S.screen = 'boot';
    return load(false);
  }).catch(function(e){ S.busy = false; S.err = errText(e); render(); });
}

/* ---------- screens ---------- */
function tab(content){ return h('div', {class: 'tab'}, content); }

function bar(){
  return h('header', {class: 'bar'},
    h('div', {class: 'brand', text: '企画ノート'}),
    h('div', {class: 'bar-r'},
      h('span', {class: 'tag', text: canEdit() ? '編集モード' : '閲覧モード'}),
      h('button', {class: 'btn', disabled: S.busy, onclick: function(){ S.msg = ''; S.err = ''; load(false).then(function(){ S.msg = '最新の内容にしました'; render(); }); }, text: '更新'}),
      h('button', {class: 'btn', onclick: function(){ toLock(''); }, text: 'ログアウト'})
    ));
}
function msgLine(){ return h('p', {class: 'msg' + (S.err ? ' err' : ''), 'aria-live': 'polite', text: S.err || S.msg}); }

function gateScreen(){
  var pw = h('input', {class: 'in', type: 'password', id: 'g-pw', autocomplete: 'current-password', placeholder: 'パスワード', 'aria-label': 'パスワード'});
  var go = h('button', {class: 'btn primary', type: 'submit', text: 'ひらく'});
  if(S.busy) go.disabled = true;
  var form = h('form', {onsubmit: function(ev){
    ev.preventDefault();
    if(S.busy || !pw.value) return;
    login(pw.value);
  }},
    h('div', {class: 'panel-body'},
      h('label', {for: 'g-pw', text: 'パスワード'}), pw,
      h('p', {class: 'err', 'aria-live': 'polite', text: S.err}),
      go));
  return h('div', {class: 'gate'},
    h('h1', {text: '企画ノート'}),
    h('p', {text: S.busy ? 'ひらいています…' : 'パスワードを知っている人だけが読めます'}),
    h('div', {class: 'panel'}, tab(svg(LOCK, 22)), form));
}

function cardEl(it, idx){
  var open = function(){ S.id = it.id; S.editing = false; S.isNew = false; S.draft = null; S.screen = 'detail'; S.err = ''; S.msg = ''; S.delArmed = false; render(); window.scrollTo(0, 0); };
  var strip = h('div', {class: 'strip'}, it.genres.length ? it.genres.map(function(g){ return h('span', {class: 'pill', text: g}); }) : h('span', {class: 'strip-empty', text: 'ジャンル未設定'}));
  return h('article', {class: 'panel card', tabindex: '0', role: 'button', 'aria-label': (it.title || it.logline || '無題') + 'を開く',
    onclick: open, onkeydown: function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } }},
    tab(String(idx + 1)),
    h('div', {class: 'panel-body'},
      it.title ? h('p', {class: 'card-title', text: it.title}) : null,
      h('p', {class: 'logline' + (it.logline ? '' : ' empty'), text: it.logline || '一言あらすじは未入力です'})),
    strip);
}

function listScreen(){
  var items = S.items;
  var wrap = h('div', {class: 'wrap'}, bar(), msgLine());
  if(!items.length){
    wrap.append(h('p', {class: 'empty-note'}, 'まだ企画がありません。', h('br'), canEdit() ? '右下の鉛筆から、最初のネタを書き留めましょう。' : '公開されるまでお待ちください。'));
  }else{
    wrap.append(h('p', {class: 'count', text: '全' + items.length + '本'}));
    items.forEach(function(it, i){ wrap.append(cardEl(it, i)); });
    wrap.append(h('div', {class: 'dots', 'aria-hidden': 'true'}, h('span'), h('span'), h('span'), h('span')));
  }
  if(canEdit()){
    wrap.append(h('button', {class: 'fab', 'aria-label': '新しい企画を書く', onclick: function(){
      S.draft = blank(); S.isNew = true; S.editing = true; S.id = S.draft.id; S.screen = 'detail'; S.err = ''; S.msg = ''; render(); window.scrollTo(0, 0);
    }}, svg(PENCIL, 28)));
  }
  return wrap;
}

function secView(label, hint, valueNode){
  return h('section', {class: 'sec'}, h('h2', {class: 'sec-label', text: label}), hint ? h('p', {class: 'sec-hint', text: hint}) : null, valueNode);
}
function textView(v){ return h('p', {class: 'text' + (v ? '' : ' empty'), text: v || '未入力'}); }
function area(id, rows, ph, getSet){
  var t = h('textarea', {class: 'in', id: id, rows: String(rows), placeholder: ph});
  t.value = getSet.get();
  t.addEventListener('input', function(){ getSet.set(t.value); autosize(t); });
  return t;
}
function simple(key, rows, ph){
  return area('f-' + key, rows, ph, {get: function(){ return S.draft[key]; }, set: function(v){ S.draft[key] = v; }});
}

function saveDraft(){
  var d = S.draft; d.genres = d.genres.slice(0, 3);
  S.busy = true; S.err = ''; S.msg = '保存しています…'; render();
  api('PUT', '/notes/' + encodeURIComponent(d.id), d).then(function(r){
    S.items = (r.items || []).map(normItem);
    S.busy = false; S.msg = '保存しました';
    S.editing = false; S.isNew = false; S.draft = null; S.id = d.id; S.screen = 'detail';
    render();
  }).catch(fail);
}
function deleteCurrent(id){
  S.busy = true; S.err = ''; S.msg = '削除しています…'; render();
  api('DELETE', '/notes/' + encodeURIComponent(id)).then(function(r){
    S.items = (r.items || []).map(normItem);
    S.busy = false; S.msg = '削除しました'; S.screen = 'list'; S.id = null; S.delArmed = false;
    render();
  }).catch(fail);
}

function detailScreen(){
  var editing = S.editing;
  var it = editing ? S.draft : current();
  if(!it){ S.screen = 'list'; return listScreen(); }
  var idx = S.items.findIndex(function(x){ return x.id === it.id; });
  var no = idx >= 0 ? idx + 1 : S.items.length + 1;

  var back = h('button', {class: 'link back', onclick: function(){ S.screen = 'list'; S.editing = false; S.draft = null; S.isNew = false; S.err = ''; S.msg = ''; render(); window.scrollTo(0, 0); }, text: '← 一覧にもどる'});
  var actions = h('div', {class: 'grp'});
  if(canEdit()){
    if(editing){
      actions.append(
        h('button', {class: 'btn', disabled: S.busy, onclick: function(){
          if(S.isNew){ S.screen = 'list'; S.draft = null; S.isNew = false; }
          S.editing = false; S.err = ''; render();
        }, text: 'やめる'}),
        h('button', {class: 'btn primary', disabled: S.busy, onclick: saveDraft, text: '保存'}));
    }else{
      actions.append(h('button', {class: 'btn', onclick: function(){
        S.draft = JSON.parse(JSON.stringify(it)); S.editing = true; S.err = ''; S.msg = ''; render();
      }, text: '編集'}));
    }
  }
  var wrap = h('div', {class: 'wrap'}, h('div', {class: 'top-actions'}, back, actions), msgLine());

  var body, strip;
  if(editing){
    var ti = h('input', {class: 'in bare title', id: 'f-title', type: 'text', placeholder: 'タイトル', 'aria-label': 'タイトル'});
    ti.value = S.draft.title; ti.addEventListener('input', function(){ S.draft.title = ti.value; });
    var lg = simple('logline', 2, '〇〇が〇〇する話'); lg.className = 'in bare logline-in'; lg.setAttribute('aria-label', '一言あらすじ');
    body = h('div', {class: 'panel-body'}, ti, lg);
    var chips = h('div', {class: 'strip'}, S.draft.genres.length ? S.draft.genres.map(function(g, i){
      return h('span', {class: 'pill removable'}, g, h('button', {class: 'x', 'aria-label': g + 'を外す', onclick: function(){ S.draft.genres.splice(i, 1); render(); }, text: '×'}));
    }) : h('span', {class: 'strip-empty', text: 'ジャンルは3つまで'}));
    var full = S.draft.genres.length >= 3;
    var gi = h('input', {class: 'in', id: 'f-genre', type: 'text', maxlength: '14', placeholder: full ? '3つ登録済みです' : 'ジャンルを入力（例：ラブコメ）', 'aria-label': 'ジャンル'});
    if(full) gi.disabled = true;
    var addGenre = function(){
      var v = gi.value.trim();
      if(!v || S.draft.genres.length >= 3) return;
      if(S.draft.genres.indexOf(v) < 0) S.draft.genres.push(v);
      S.focusId = 'f-genre'; render();
    };
    gi.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); addGenre(); } });
    var add = h('button', {class: 'btn', type: 'button', onclick: addGenre, text: '追加'}); if(full) add.disabled = true;
    strip = h('div', null, chips, h('div', {class: 'genre-add'}, gi, add));
  }else{
    body = h('div', {class: 'panel-body'},
      h('p', {class: 'title-view', text: it.title || '無題'}),
      h('p', {class: 'logline' + (it.logline ? '' : ' empty'), text: it.logline || '一言あらすじは未入力です'}));
    strip = h('div', {class: 'strip'}, it.genres.length ? it.genres.map(function(g){ return h('span', {class: 'pill', text: g}); }) : h('span', {class: 'strip-empty', text: 'ジャンル未設定'}));
  }
  wrap.append(h('div', {class: 'panel'}, tab(String(no)), body, strip));

  var secs = h('div', {class: 'sections'});
  function textSec(label, hint, key, rows, ph){
    secs.append(secView(label, hint, editing ? simple(key, rows, ph) : textView(it[key])));
  }
  textSec('あらすじ', '', 'synopsis', 6, '物語の流れを、自由に書いてください');
  textSec('ターゲット読者', 'どんな読者に向けて描くか', 'target', 3, '例：仕事に疲れた20〜30代の会社員');
  textSec('この漫画でやりたいこと', '', 'goal', 4, '描きたいシーン、伝えたい感情、試したい表現など');
  textSec('読み続けてもらうポイント', '次の話も読みたくなる引き', 'hook', 4, '謎、成長、関係の変化、毎話の楽しみなど');

  var charBox;
  if(editing){
    charBox = h('div', null);
    var list = h('div', {class: 'chars'});
    S.draft.chars.forEach(function(c, i){
      var nm = h('input', {class: 'in', id: 'c-name-' + i, type: 'text', placeholder: '名前', 'aria-label': 'キャラ' + (i + 1) + 'の名前'});
      nm.value = c.name; nm.addEventListener('input', function(){ c.name = nm.value; });
      var ds = area('c-desc-' + i, 3, '年齢・性格・見た目・役割など', {get: function(){ return c.desc; }, set: function(v){ c.desc = v; }});
      ds.setAttribute('aria-label', 'キャラ' + (i + 1) + 'の説明');
      list.append(h('div', {class: 'char'},
        h('div', {class: 'char-head'}, h('span', {class: 'char-no', text: 'キャラ ' + (i + 1)}), h('button', {class: 'link', onclick: function(){ S.draft.chars.splice(i, 1); render(); }, text: '削除'})),
        h('div', {style: 'display:grid;gap:10px'}, nm, ds)));
    });
    charBox.append(list, h('button', {class: 'btn add-char', onclick: function(){ S.draft.chars.push({name: '', desc: ''}); S.focusId = 'c-name-' + (S.draft.chars.length - 1); render(); }, text: '＋ キャラを追加'}));
  }else{
    charBox = it.chars.length ? h('div', {class: 'chars'}, it.chars.map(function(c){
      return h('div', {class: 'char'}, h('p', {class: 'char-name', text: c.name || '名前未定'}), h('p', {class: 'text' + (c.desc ? '' : ' empty'), text: c.desc || '説明なし'}));
    })) : textView('');
  }
  secs.append(secView('キャラクター', '', charBox));

  var plot = h('div', {class: 'plot'});
  [0, 1, 2].forEach(function(i){
    var cell;
    if(editing){
      cell = area('f-plot-' + i, 3, i === 0 ? '導入：何が起きて、主人公はどうなるか' : i === 1 ? '展開：状況がどう変わるか' : '引き：次を読みたくなる終わり方', {get: function(){ return S.draft.plot[i]; }, set: function(v){ S.draft.plot[i] = v; }});
      cell.setAttribute('aria-label', '第' + (i + 1) + '話のプロット');
    }else cell = textView(it.plot[i]);
    plot.append(h('div', {class: 'ep'}, h('div', {class: 'ep-no', text: '第' + (i + 1) + '話'}), cell));
  });
  secs.append(secView('簡易3話分プロット', '', plot));
  wrap.append(secs);

  if(!editing && it.updated){
    var dt = new Date(it.updated);
    if(!isNaN(dt)) wrap.append(h('p', {class: 'stamp', text: '最終更新 ' + dt.toLocaleDateString('ja-JP')}));
  }
  if(!editing && canEdit() && idx >= 0){
    wrap.append(h('div', {class: 'danger-zone'}, h('button', {class: 'link danger', disabled: S.busy, onclick: function(){
      if(!S.delArmed){ S.delArmed = true; render(); return; }
      deleteCurrent(it.id);
    }, text: S.delArmed ? '本当に削除する（もう一度押す）' : 'この企画を削除'})));
  }
  return wrap;
}

function bootScreen(){
  return h('div', {class: 'gate'}, h('h1', {text: '企画ノート'}), h('p', {text: '読み込んでいます…'}));
}

function render(){
  var node;
  if(S.screen === 'lock') node = gateScreen();
  else if(S.screen === 'list') node = listScreen();
  else if(S.screen === 'detail') node = detailScreen();
  else node = bootScreen();
  $app.replaceChildren(node);
  Array.prototype.forEach.call($app.querySelectorAll('textarea'), autosize);
  var f = S.focusId; S.focusId = '';
  var target = f ? document.getElementById(f) : (S.screen === 'lock' ? document.getElementById('g-pw') : null);
  if(target && !target.disabled){ try{ target.focus(); }catch(e){} }
}

/* ---------- start ---------- */
render();
if(S.token){ load(false); }
else { S.screen = 'lock'; render(); }

/* 別の端末で書いた内容を、戻ってきたときに自動で読み込む */
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && S.token && S.screen === 'list' && !S.busy) load(true);
});
})();
</script>
</body>
</html>
